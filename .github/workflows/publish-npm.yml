name: Publish to npm

# Generated by the Time Trakkr release, like everything in this repository.
# Changes made here are replaced by the next release.
#
# Publishes npm/ as @timetrakkr/cli when a release tag v<version> is pushed.
# The package is the CLI file that is also bundled in every plugin here, so
# the CLI on npm and in the plugins is the same file at the same version.
#
# Off until configured: with the repository variable NPM_PUBLISH unset (or
# anything but `true`), the job is skipped.
#
# Authenticates with npm trusted publishing (OIDC): no token is stored. The
# very first version, before the package exists on npm and can have a trusted
# publisher, can use an NPM_TOKEN secret on the `npm` environment instead;
# delete it once trusted publishing is set up.
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @timetrakkr/cli
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm's trusted publisher names this environment, so a job outside it
    # cannot publish even from this workflow.
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm exchanges for a one-time publish credential, and
      # signs the provenance statement with.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the package before publishing it
        working-directory: npm
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          npm_version="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number)
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)
          ' "$npm_version"; then
            echo "::error::npm $npm_version cannot use trusted publishing; it needs 11.5.1 or later."
            exit 1
          fi
          manifest_version="$(node -p 'require("./package.json").version')"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::npm/package.json is $manifest_version but the tag is $REF_NAME."
            exit 1
          fi
          cli_version="$(node dist/timetrakkr.cjs --version)"
          if [ "$cli_version" != "$version" ]; then
            echo "::error::The CLI says it is $cli_version but the tag is $REF_NAME."
            exit 1
          fi
          if [ ! -f LICENSE ] || [ -z "$(node -p 'require("./package.json").license || ""')" ]; then
            echo "::error::The package has no license. Nothing is published until it has one."
            exit 1
          fi
          npm pack --dry-run

      # Provenance links the published version to this repository, this
      # workflow and this commit, which holds the exact file that is published.
      - name: Publish
        working-directory: npm
        env:
          # Empty, and unused, once trusted publishing is set up.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
